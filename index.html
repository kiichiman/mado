<script>
(function () {
  "use strict";

  var STORAGE_KEY = "bdash-window-progress-v1";

  var INITIAL = {
    siteName: "宝順一 様",
    estimateNo: "20260928-009",
    items: [
      { id: "i1", name: "窓サッシ網戸", qty: 3, unit: "枠" },
      { id: "i2", name: "窓サッシ小窓セット", qty: 4, unit: "セット" },
      { id: "i3", name: "玄関窓サッシ", qty: 1, unit: "枠" },
      { id: "i4", name: "窓サッシ網戸（小）", qty: 5, unit: "枠" },
      { id: "i5", name: "窓サッシ出窓", qty: 1, unit: "枠" }
    ],
    days: [],
    cells: {}
  };

  var state = null;
  var editing = false;
  var confirmTimers = new WeakMap();
  var confirmHandlers = new WeakMap();
  var waking = false;
  var wakeSentinel = null;

  function clone(o) {
    return JSON.parse(JSON.stringify(o));
  }

  function cellKey(itemId, index) {
    return itemId + "#" + index;
  }

  function getCell(itemId, index) {
    var k = cellKey(itemId, index);
    if (!state.cells[k]) {
      state.cells[k] = { doneAt: null, memo: "" };
    }
    return state.cells[k];
  }

  function pad2(n) {
    return (n < 10 ? "0" : "") + n;
  }

  function hhmm(d) {
    return d.getHours() + ":" + pad2(d.getMinutes());
  }

  function hhmmPad(d) {
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function timeInputValue(d) {
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  function todayStartDate() {
    var start = null;
    for (var i = 0; i < state.days.length; i++) {
      var ds = new Date(state.days[i].start);
      if (isNaN(ds.getTime())) continue;
      if (start === null || ds.getTime() > start.getTime()) start = ds;
    }
    return start;
  }

  function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
  }

  function dayStartFor(timeMs) {
    var best = null;
    for (var i = 0; i < state.days.length; i++) {
      var ds = new Date(state.days[i].start);
      if (isNaN(ds.getTime())) continue;
      var ms = ds.getTime();
      if (ms > timeMs) continue;
      if (best === null || ms > best.getTime()) best = ds;
    }
    return best;
  }

  function durationMinutes(itemId, index) {
    var key = cellKey(itemId, index);
    var c = state.cells[key];
    if (!c || !c.doneAt) return null;
    var d = new Date(c.doneAt);
    if (isNaN(d.getTime())) return null;
    var t = d.getTime();
    var day = dayStartFor(t);
    if (day === null) return null;
    var baseMs = day.getTime();
    var prev = lastDoneBefore(t, key);
    if (prev !== null && prev > baseMs) baseMs = prev;
    var diff = t - baseMs;
    if (diff < 0) return null;
    return Math.round(diff / 60000);
  }

  function validDurations() {
    var out = [];
    for (var k in state.cells) {
      if (!Object.prototype.hasOwnProperty.call(state.cells, k)) continue;
      var c = state.cells[k];
      if (!c || !c.doneAt) continue;
      var idx = k.split("#");
      var itemId = idx[0];
      var index = Number(idx[1]);
      var m = durationMinutes(itemId, index);
      if (m !== null) out.push(m);
    }
    return out;
  }

  function lastDoneBefore(timeMs, exceptKey) {
    var best = null;
    for (var k in state.cells) {
      if (!Object.prototype.hasOwnProperty.call(state.cells, k)) continue;
      if (exceptKey && k === exceptKey) continue;
      var dt = state.cells[k].doneAt;
      if (!dt) continue;
      var ms = new Date(dt).getTime();
      if (isNaN(ms)) continue;
      if (ms <= timeMs) {
        if (best === null || ms > best) best = ms;
      }
    }
    return best;
  }

  /* ---- enumerate done times in progress order ---- */
  function doneTimesSorted() {
    var arr = [];
    for (var k in state.cells) {
      if (!Object.prototype.hasOwnProperty.call(state.cells, k)) continue;
      var dt = state.cells[k].doneAt;
      if (!dt) continue;
      var d = new Date(dt);
      if (isNaN(d.getTime())) continue;
      arr.push(d);
    }
    arr.sort(function (a, b) { return a.getTime() - b.getTime(); });
    return arr;
  }

  /* ---- load / save ---- */
  function load() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      if (!raw) return clone(INITIAL);
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") return clone(INITIAL);
      var s = {
        siteName: typeof parsed.siteName === "string" ? parsed.siteName : INITIAL.siteName,
        estimateNo: typeof parsed.estimateNo === "string" ? parsed.estimateNo : INITIAL.estimateNo,
        items: [],
        days: [],
        cells: {}
      };
      if (Array.isArray(parsed.items)) {
        for (var i = 0; i < parsed.items.length; i++) {
          var it = parsed.items[i];
          if (!it || typeof it !== "object") continue;
          s.items.push({
            id: typeof it.id === "string" ? it.id : "i" + i,
            name: typeof it.name === "string" ? it.name : "",
            qty: Math.max(1, Math.floor(Number(it.qty)) || 1),
            unit: typeof it.unit === "string" ? it.unit : "枠"
          });
        }
      }
      if (Array.isArray(parsed.days)) {
        for (var j = 0; j < parsed.days.length; j++) {
          var day = parsed.days[j];
          if (!day || typeof day !== "object") continue;
          if (typeof day.start !== "string") continue;
          if (isNaN(new Date(day.start).getTime())) continue;
          s.days.push({ start: day.start });
        }
      }
      if (parsed.cells && typeof parsed.cells === "object") {
        for (var k in parsed.cells) {
          if (!Object.prototype.hasOwnProperty.call(parsed.cells, k)) continue;
          var c = parsed.cells[k];
          if (!c || typeof c !== "object") continue;
          s.cells[k] = {
            doneAt: typeof c.doneAt === "string" && !isNaN(new Date(c.doneAt).getTime()) ? c.doneAt : null,
            memo: typeof c.memo === "string" ? c.memo : ""
          };
        }
      }
      return s;
    } catch (e) {
      return clone(INITIAL);
    }
  }

  function save() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      /* storage unavailable: keep running in memory */
    }
  }

  /* ---- totals ---- */
  function totalCount() {
    var t = 0;
    for (var i = 0; i < state.items.length; i++) t += state.items[i].qty;
    return t;
  }

  function doneCount() {
    var n = 0;
    for (var i = 0; i < state.items.length; i++) {
      var it = state.items[i];
      for (var j = 0; j < it.qty; j++) {
        var c = state.cells[cellKey(it.id, j)];
        if (c && c.doneAt) n++;
      }
    }
    return n;
  }

  function nextDayNumber() {
    return state.days.length + 1;
  }

  /* ---- rendering ---- */
  var el = {};

  function cacheEls() {
    el.siteName = document.getElementById("siteName");
    el.estimateNo = document.getElementById("estimateNo");
    el.remainCount = document.getElementById("remainCount");
    el.doneCount = document.getElementById("doneCount");
    el.totalCount = document.getElementById("totalCount");
    el.progressBar = document.getElementById("progressBar");
    el.progressFill = document.getElementById("progressFill");
    el.progressLabel = document.getElementById("progressLabel");
    el.statStart = document.getElementById("statStart");
    el.statElapsed = document.getElementById("statElapsed");
    el.statAvg = document.getElementById("statAvg");
    el.statEta = document.getElementById("statEta");
    el.dayList = document.getElementById("dayList");
    el.startDayBtn = document.getElementById("startDayBtn");
    el.groups = document.getElementById("groups");
    el.editToggle = document.getElementById("editToggle");
    el.editPanel = document.getElementById("editPanel");
    el.editSiteName = document.getElementById("editSiteName");
    el.editEstimateNo = document.getElementById("editEstimateNo");
    el.editItems = document.getElementById("editItems");
    el.editWarn = document.getElementById("editWarn");
    el.addName = document.getElementById("addName");
    el.addQty = document.getElementById("addQty");
    el.addUnit = document.getElementById("addUnit");
    el.addItemBtn = document.getElementById("addItemBtn");
    el.resetBtn = document.getElementById("resetBtn");
    el.copyBtn = document.getElementById("copyBtn");
    el.copyFallback = document.getElementById("copyFallback");
    el.copyText = document.getElementById("copyText");
  }

  function renderHeader() {
    el.siteName.textContent = state.siteName;
    el.estimateNo.textContent = "見積番号 " + state.estimateNo;

    var total = totalCount();
    var done = doneCount();
    var remain = Math.max(0, total - done);

    el.remainCount.textContent = String(remain);
    el.doneCount.textContent = String(done);
    el.totalCount.textContent = String(total);

    var pct = total === 0 ? 0 : Math.round((done / total) * 100);
    el.progressFill.style.width = pct + "%";
    el.progressLabel.textContent = pct + "%";
    el.progressBar.setAttribute("aria-valuenow", String(pct));
  }

  function renderStats() {
    var now = new Date();
    var start = todayStartDate();
    var startIsToday = start !== null && isSameDay(start, now);

    if (startIsToday) {
      el.statStart.textContent = hhmmPad(start);
      var elapsedMs = now.getTime() - start.getTime();
      if (elapsedMs < 0) elapsedMs = 0;
      var elMin = Math.floor(elapsedMs / 60000);
      el.statElapsed.textContent = Math.floor(elMin / 60) + "時間" + (elMin % 60) + "分";
    } else {
      el.statStart.textContent = "—";
      el.statElapsed.textContent = "—";
    }

    var durs = validDurations();
    var avg = null;
    if (durs.length > 0) {
      var sum = 0;
      for (var i = 0; i < durs.length; i++) sum += durs[i];
      avg = sum / durs.length;
    }

    if (avg === null) {
      el.statAvg.textContent = "—";
      el.statEta.textContent = "—";
    } else {
      var avgMin = Math.round(avg);
      el.statAvg.textContent = avgMin + "分";

      var total = totalCount();
      var done = doneCount();
      var remain = Math.max(0, total - done);
      var etaMs = now.getTime() + remain * avg * 60000;
      var eta = new Date(etaMs);
      el.statEta.textContent = hhmmPad(eta);
    }
  }

  function renderDays() {
    el.dayList.textContent = "";

    for (var i = 0; i < state.days.length; i++) {
      (function (idx) {
        var d = new Date(state.days[idx].start);
        var item = document.createElement("div");
        item.className = "day-item";

        var name = document.createElement("span");
        name.className = "day-name";
        name.textContent = (idx + 1) + "日目";
        item.appendChild(name);

        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "time-tap num";
        btn.textContent = isNaN(d.getTime()) ? "—" : hhmmPad(d);
        btn.title = "開始時刻を修正";
        btn.addEventListener("click", function () {
          openTimeEditor(btn, state.days[idx].start, function (newDate) {
            state.days[idx].start = newDate.toISOString();
            save();
            renderAll();
          });
        });
        item.appendChild(btn);

        el.dayList.appendChild(item);
      })(i);
    }

    el.startDayBtn.textContent = nextDayNumber() + "日目 開始";
    if (state.days.length === 0) {
      el.startDayBtn.className = "btn day-first";
      el.dayList.hidden = true;
    } else {
      el.startDayBtn.className = "btn";
      el.dayList.hidden = false;
    }
  }

  function openTimeEditor(anchorBtn, currentIso, onCommit) {
    var cur = new Date(currentIso);
    var input = document.createElement("input");
    input.type = "time";
    input.className = "num";
    input.value = isNaN(cur.getTime()) ? "" : timeInputValue(cur);

    var committed = false;
    function commit() {
      if (committed) return;
      committed = true;
      if (!input.value) {
        renderAll();
        return;
      }
      var parts = input.value.split(":");
      var h = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10);
      if (isNaN(h) || isNaN(m)) {
        renderAll();
        return;
      }
      var base = isNaN(cur.getTime()) ? new Date() : cur;
      var nd = new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m, 0, 0);
      onCommit(nd);
    }

    input.addEventListener("change", commit);
    input.addEventListener("blur", commit);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        commit();
      }
    });

    anchorBtn.hidden = true;
    anchorBtn.parentNode.insertBefore(input, anchorBtn);
    try { input.focus(); } catch (e) { /* ignore */ }
    if (input.showPicker) {
      try { input.showPicker(); } catch (e) { /* ignore */ }
    }
  }

  function renderGroups() {
    el.groups.textContent = "";

    for (var i = 0; i < state.items.length; i++) {
      (function (item) {
        var group = document.createElement("section");
        group.className = "group";

        var head = document.createElement("div");
        head.className = "group-head";

        var nameEl = document.createElement("span");
        nameEl.className = "group-name";
        nameEl.textContent = item.name;
        head.appendChild(nameEl);

        var doneIn = 0;
        for (var j = 0; j < item.qty; j++) {
          var c = state.cells[cellKey(item.id, j)];
          if (c && c.doneAt) doneIn++;
        }

        var countEl = document.createElement("span");
        countEl.className = "group-count num";
        countEl.textContent = doneIn + " / " + item.qty + " " + item.unit;
        head.appendChild(countEl);

        group.appendChild(head);

        for (var k = 0; k < item.qty; k++) {
          group.appendChild(buildRow(item, k));
        }

        el.groups.appendChild(group);
      })(state.items[i]);
    }
  }

  function buildRow(item, index) {
    var cell = getCell(item.id, index);
    var row = document.createElement("div");
    row.className = "row" + (cell.doneAt ? " is-done" : "");

    var main = document.createElement("div");
    main.className = "row-main";

    var label = document.createElement("span");
    label.className = "row-label num";
    label.textContent = (index + 1) + "/" + item.qty;
    main.appendChild(label);

    if (cell.doneAt) {
      var d = new Date(cell.doneAt);

      var info = document.createElement("div");
      info.className = "done-info";

      var tw = document.createElement("span");
      tw.className = "done-time-wrap";

      var tbtn = document.createElement("button");
      tbtn.type = "button";
      tbtn.className = "time-tap done-time num";
      tbtn.textContent = isNaN(d.getTime()) ? "—" : hhmm(d);
      tbtn.title = "完了時刻を修正";
      tbtn.addEventListener("click", function () {
        openTimeEditor(tbtn, cell.doneAt, function (newDate) {
          cell.doneAt = newDate.toISOString();
          save();
          renderAll();
        });
      });
      tw.appendChild(tbtn);

      var durMin = durationMinutes(item.id, index);
      var dur = durMin === null ? "" : durMin + "分";
      var durEl = document.createElement("span");
      durEl.className = "duration num";
      durEl.textContent = dur;
      tw.appendChild(durEl);

      info.appendChild(tw);

      var undo = document.createElement("button");
      undo.type = "button";
      undo.className = "mini";
      undo.textContent = "取り消し";
      undo.addEventListener("click", function () {
        cell.doneAt = null;
        save();
        renderAll();
      });
      info.appendChild(undo);

      main.appendChild(info);
    } else {
      var doneBtn = document.createElement("button");
      doneBtn.type = "button";
      doneBtn.className = "done-btn";
      doneBtn.textContent = "完了";
      doneBtn.addEventListener("click", function () {
        cell.doneAt = new Date().toISOString();
        save();
        renderAll();
      });
      main.appendChild(doneBtn);
    }

    row.appendChild(main);

    var memoRow = document.createElement("div");
    memoRow.className = "memo-row";

    var memoId = "memo-" + cellKey(item.id, index);
    var memoLabel = document.createElement("label");
    memoLabel.setAttribute("for", memoId);
    memoLabel.textContent = "場所メモ";
    memoRow.appendChild(memoLabel);

    var memo = document.createElement("input");
    memo.type = "text";
    memo.id = memoId;
    memo.className = "memo-input";
    memo.value = cell.memo || "";
    memo.placeholder = "例：和室・2階寝室";
    memo.autocomplete = "off";
    memo.addEventListener("input", function () {
      cell.memo = memo.value;
      save();
    });
    memoRow.appendChild(memo);

    row.appendChild(memoRow);

    return row;
  }

  function renderEditPanel() {
    el.editPanel.hidden = !editing;
    el.editToggle.setAttribute("aria-pressed", editing ? "true" : "false");
    el.editToggle.textContent = editing ? "編集を終了" : "編集";

    if (!editing) return;

    el.editSiteName.value = state.siteName;
    el.editEstimateNo.value = state.estimateNo;

    renderEditItems();
    el.editWarn.hidden = true;
  }

  function renderEditItems() {
    el.editItems.textContent = "";

    for (var i = 0; i < state.items.length; i++) {
      (function (item) {
        var box = document.createElement("div");
        box.className = "edit-item";

        var controls = document.createElement("div");
        controls.className = "edit-item-controls";

        var nameField = document.createElement("div");
        nameField.className = "field";
        var nameLabel = document.createElement("label");
        nameLabel.textContent = "品目名";
        var nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = item.name;
        nameInput.autocomplete = "off";
        nameInput.addEventListener("input", function () {
          item.name = nameInput.value;
          save();
          renderHeader();
          renderGroups();
        });
        nameField.appendChild(nameLabel);
        nameField.appendChild(nameInput);
        controls.appendChild(nameField);

        var qtyField = document.createElement("div");
        qtyField.className = "field";
        var qtyLabel = document.createElement("label");
        qtyLabel.textContent = "数量（" + item.unit + "）";
        var qtyInput = document.createElement("input");
        qtyInput.type = "number";
        qtyInput.min = "1";
        qtyInput.step = "1";
        qtyInput.value = String(item.qty);
        qtyInput.inputMode = "numeric";
        qtyInput.style.width = "90px";
        qtyInput.addEventListener("change", function () {
          applyQty(item, qtyInput);
        });
        qtyField.appendChild(qtyLabel);
        qtyField.appendChild(qtyInput);
        controls.appendChild(qtyField);

        box.appendChild(controls);

        var del = document.createElement("button");
        del.type = "button";
        del.className = "mini danger";
        del.textContent = "この品目を削除";
        var confirmLabels = {
          idle: "この品目を削除",
          armed: "もう一度押すと削除"
        };
        armConfirm(del, confirmLabels, function () {
          removeItem(item.id);
        });
        box.appendChild(del);

        el.editItems.appendChild(box);
      })(state.items[i]);
    }
  }

  function applyQty(item, qtyInput) {
    var next = Math.floor(Number(qtyInput.value));
    if (!next || next < 1) {
      qtyInput.value = String(item.qty);
      return;
    }
    if (next > item.qty) {
      item.qty = next;
      save();
      renderAll();
      return;
    }
    if (next === item.qty) return;

    var toRemove = item.qty - next;
    var undone = [];
    for (var j = item.qty - 1; j >= 0; j--) {
      var c = state.cells[cellKey(item.id, j)];
      if (!(c && c.doneAt)) undone.push(j);
    }
    if (undone.length < toRemove) {
      showWarn("完了済みの枠があるため、これ以上減らせません。");
      qtyInput.value = String(item.qty);
      return;
    }

    for (var r = 0; r < toRemove; r++) {
      delete state.cells[cellKey(item.id, undone[r])];
    }

    var remaining = [];
    for (var m = 0; m < item.qty; m++) {
      var cell = state.cells[cellKey(item.id, m)];
      if (cell) {
        remaining.push(cell);
        delete state.cells[cellKey(item.id, m)];
      }
    }
    for (var n = 0; n < remaining.length; n++) {
      state.cells[cellKey(item.id, n)] = remaining[n];
    }
    item.qty = next;
    el.editWarn.hidden = true;
    save();
    renderAll();
  }

  function removeItem(itemId) {
    var kept = [];
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === itemId) continue;
      kept.push(state.items[i]);
    }
    for (var k in state.cells) {
      if (!Object.prototype.hasOwnProperty.call(state.cells, k)) continue;
      if (k.indexOf(itemId + "#") === 0) delete state.cells[k];
    }
    state.items = kept;
    save();
    renderAll();
  }

  function showWarn(msg) {
    el.editWarn.textContent = msg;
    el.editWarn.hidden = false;
  }

  /* ---- double-tap confirm ---- */
  function armConfirm(btn, labels, action) {
    var oldHandler = confirmHandlers.get(btn);
    if (oldHandler) {
      btn.removeEventListener("click", oldHandler);
    }
    var handler = function () {
      if (btn.dataset.armed === "1") {
        disarm();
        action();
        return;
      }
      btn.dataset.armed = "1";
      btn.textContent = labels.armed;
      var t = window.setTimeout(disarm, 3000);
      confirmTimers.set(btn, t);
    };
    function disarm() {
      btn.dataset.armed = "0";
      btn.textContent = labels.idle;
      var t = confirmTimers.get(btn);
      if (t) window.clearTimeout(t);
      confirmTimers.set(btn, null);
    }
    confirmHandlers.set(btn, handler);
    btn.addEventListener("click", handler);
  }

  function resetAll() {
    state = clone(INITIAL);
    save();
    renderAll();
  }

  /* ---- report text ---- */
  function buildReport() {
    var now = new Date();
    var lines = [];
    var dateStr = (now.getMonth() + 1) + "/" + now.getDate() + " " + hhmmPad(now);
    lines.push(state.siteName + " 窓清掃 進捗（" + dateStr + "時点）");

    var total = totalCount();
    var done = doneCount();
    lines.push("完了 " + done + " / " + total + "（残り " + Math.max(0, total - done) + "）");

    for (var i = 0; i < state.items.length; i++) {
      var item = state.items[i];
      var times = [];
      var doneIn = 0;
      for (var j = 0; j < item.qty; j++) {
        var c = state.cells[cellKey(item.id, j)];
        if (c && c.doneAt) {
          var d = new Date(c.doneAt);
          if (!isNaN(d.getTime())) {
            times.push(hhmm(d));
            doneIn++;
          }
        }
      }
      if (doneIn === item.qty) {
        lines.push("・" + item.name + " " + doneIn + "/" + item.qty + " 完了（" + times.join(", ") + "）");
      } else {
        var suffix = times.length > 0 ? "（" + times.join(", ") + "）" : "";
        lines.push("・" + item.name + " " + doneIn + "/" + item.qty + suffix);
      }
    }

    return lines.join("\n");
  }

  function doCopy() {
    var text = buildReport();
    var done = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        var p = navigator.clipboard.writeText(text);
        if (p && typeof p.then === "function") {
          p.then(function () { showCopied(); }, function () { showFallback(text); });
          return;
        }
        showCopied();
        return;
      }
    } catch (e) {
      done = false;
    }
    if (!done) showFallback(text);
  }

  function showCopied() {
    el.copyFallback.hidden = true;
    el.copyBtn.textContent = "コピーしました";
    window.setTimeout(function () {
      el.copyBtn.textContent = "報告文をコピー";
    }, 2000);
  }

  function showFallback(text) {
    el.copyText.value = text;
    el.copyFallback.hidden = false;
    try {
      el.copyText.focus();
      el.copyText.select();
    } catch (e) { /* ignore */ }
  }

  /* ---- wake lock ---- */
  function requestWakeLock() {
    try {
      if (!navigator.wakeLock || !navigator.wakeLock.request) return;
      if (waking) return;
      waking = true;
      var p = navigator.wakeLock.request("screen");
      if (p && typeof p.then === "function") {
        p.then(function (sentinel) {
          wakeSentinel = sentinel;
          if (sentinel && typeof sentinel.addEventListener === "function") {
            sentinel.addEventListener("release", function () {
              waking = false;
              wakeSentinel = null;
            });
          }
        }, function () { waking = false; });
      } else {
        waking = false;
      }
    } catch (e) {
      waking = false;
    }
  }

  /* ---- render all ---- */
  function renderAll() {
    renderHeader();
    renderStats();
    renderDays();
    renderGroups();
    renderEditPanel();
  }

  /* ---- events ---- */
  function bind() {
    el.startDayBtn.addEventListener("click", function () {
      state.days.push({ start: new Date().toISOString() });
      save();
      renderAll();
      requestWakeLock();
    });

    el.editToggle.addEventListener("click", function () {
      editing = !editing;
      renderEditPanel();
      if (editing && el.editPanel) {
        try {
          var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          el.editPanel.scrollIntoView(reduce ? { block: "start" } : { block: "start", behavior: "smooth" });
        } catch (e) {
          try { el.editPanel.scrollIntoView(); } catch (e2) {}
        }
      }
    });

    el.editSiteName.addEventListener("input", function () {
      state.siteName = el.editSiteName.value;
      save();
      renderHeader();
    });

    el.editEstimateNo.addEventListener("input", function () {
      state.estimateNo = el.editEstimateNo.value;
      save();
      renderHeader();
    });

    el.addItemBtn.addEventListener("click", function () {
      var name = el.addName.value.trim();
      var qty = Math.floor(Number(el.addQty.value));
      var unit = el.addUnit.value.trim() || "枠";
      if (!name) {
        showWarn("品目名を入力してください。");
        return;
      }
      if (!qty || qty < 1) {
        showWarn("数量は1以上を入力してください。");
        return;
      }
      state.items.push({
        id: "i" + Date.now() + "-" + Math.floor(Math.random() * 1000),
        name: name,
        qty: qty,
        unit: unit
      });
      el.addName.value = "";
      el.addQty.value = "1";
      el.addUnit.value = "枠";
      el.editWarn.hidden = true;
      save();
      renderAll();
    });

    var resetLabels = {
      idle: "新しい現場にする（全データ消去）",
      armed: "もう一度押すと全消去"
    };
    armConfirm(el.resetBtn, resetLabels, function () {
      resetAll();
    });

    el.copyBtn.addEventListener("click", doCopy);

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        renderStats();
        requestWakeLock();
      }
    });

    window.setInterval(function () {
      renderStats();
    }, 30000);

    try {
      var mq = window.matchMedia("(prefers-color-scheme: dark)");
      if (mq && mq.addEventListener) {
        mq.addEventListener("change", function () { /* tokens handle it */ });
      }
    } catch (e) { /* ignore */ }
  }

  /* ---- start ---- */
  cacheEls();
  state = load();
  save();
  bind();
  renderAll();
  requestWakeLock();
})();
</script>

</body></html>
